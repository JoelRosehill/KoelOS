name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86

      - name: 64-bit metal — build + boot smoke test
        run: ./build.sh --arch 64 --target metal --test

      - name: 64-bit floppy — build + boot smoke test
        run: ./build.sh --arch 64 --target floppy --test

      - name: 32-bit metal — build + boot smoke test
        run: ./build.sh --arch 32 --target metal --test

      - name: 32-bit floppy — build + boot smoke test
        run: ./build.sh --arch 32 --target floppy --test
