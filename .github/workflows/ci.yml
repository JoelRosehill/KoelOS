name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86

      - name: Build metal image
        run: bash build_metal.sh

      - name: Boot smoke test (HDD)
        run: bash scripts/smoke_test.sh

      - name: Build floppy image
        run: bash build_floppy.sh

      - name: Boot smoke test (floppy)
        run: bash scripts/smoke_test.sh floppy
